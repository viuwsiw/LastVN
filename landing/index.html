<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1010">
  <meta name="description" content="Подключение к LastVN. Получи HTTPS-подписку в Telegram у @iuanvl.">
  <meta name="referrer" content="no-referrer">
  <title>LastVN — VPN от Тохи</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1010;
      --panel: #151b1a;
      --ink: #f0f7f4;
      --muted: #a4b5ad;
      --accent: #adf4ce;
      --line: #2c3933;
      font: 100%/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 82% 0%, #1a352b, transparent 49rem), var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    p, h1, h2, figure { margin: 0; }

    .container {
      width: min(75rem, calc(100% - 2 * clamp(1rem, 5vw, 4.5rem)));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 5.75rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .72rem;
      color: var(--accent);
      font-size: 1.52rem;
      font-weight: 800;
      letter-spacing: -.065em;
      line-height: 1;
      white-space: nowrap;
    }

    .brand-mark {
      position: relative;
      width: 2.45rem;
      height: 2.45rem;
      overflow: hidden;
      background: #0a0f0d;
      border: 1px solid var(--line);
      border-radius: .68rem;
    }

    .brand-mark img {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 3.65rem;
      height: 3.65rem;
      transform: translate(-50%, -50%);
    }

    .masthead a {
      padding-block: .55rem;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
    }

    .masthead a:hover { color: var(--ink); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      padding: 1.125rem;
      border: 1px solid var(--line);
      border-radius: 1.9rem;
      background: linear-gradient(137deg, #1c2923, var(--panel) 64%);
      box-shadow: 0 1.8rem 6rem rgb(0 0 0 / .22);
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(2rem, 5.4vw, 4.5rem) clamp(1.35rem, 4.1vw, 3.65rem);
    }

    h1 {
      font-size: clamp(3.55rem, 7.4vw, 6.5rem);
      letter-spacing: -.078em;
      line-height: .93;
      font-weight: 800;
    }

    h1 span { display: block; color: var(--accent); }

    .tagline {
      max-width: 24rem;
      margin: 1.65rem 0 2rem;
      color: var(--muted);
      font-size: clamp(1.06rem, 1.5vw, 1.24rem);
      text-wrap: pretty;
    }

    .action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 3.65rem;
      padding: .85rem 1.35rem;
      border-radius: .85rem;
      color: #101c16;
      background: var(--accent);
      font-weight: 750;
      text-decoration: none;
      text-align: center;
      transition: background-color .18s ease, transform .18s ease;
    }

    .action:hover { background: #d0ffe4; transform: translateY(-2px); }

    .contact {
      margin-top: .7rem;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
    }

    .location {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: end;
      min-height: clamp(24rem, 35vw, 33rem);
      overflow: hidden;
      border: 1px solid #3d4b42;
      border-radius: 1.15rem;
      background: linear-gradient(135deg, #283f35, #0c1010);
    }

    .location img,
    .location::after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .location img {
      z-index: -2;
      object-fit: cover;
      object-position: 50% 48%;
    }

    .location::after {
      z-index: -1;
      content: "";
      background: linear-gradient(180deg, transparent 46%, rgb(7 15 11 / .9));
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: 1.5rem;
      color: #fff;
      font-weight: 680;
      font-size: clamp(1.12rem, 2.15vw, 1.58rem);
      letter-spacing: -.037em;
    }

    .flag { line-height: 1; font-size: 1.85rem; }

    .setup {
      padding-block: clamp(2rem, 5vw, 3.45rem) 2.25rem;
      scroll-margin-top: 1rem;
    }

    h2 {
      font-size: clamp(1.5rem, 2.55vw, 2.05rem);
      font-weight: 730;
      letter-spacing: -.043em;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      margin: .95rem 0 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 1.05rem;
      background: var(--panel);
      list-style: none;
    }

    .steps li { padding: 1.1rem 1.25rem 1.2rem; }
    .steps li + li { border-inline-start: 1px solid var(--line); }
    .steps strong { font-weight: 700; }
    .steps p { margin-top: .28rem; color: var(--muted); }

    @media (max-width: 760px) {
      .masthead { min-height: 4.6rem; }
      .hero { grid-template-columns: 1fr; gap: .45rem; padding: .75rem; border-radius: 1.5rem; }
      .intro { padding: clamp(1.85rem, 7vw, 3rem) clamp(1rem, 5vw, 2rem); }
      .location { min-height: clamp(13rem, 57vw, 23rem); border-radius: .9rem; }
      figcaption { padding: 1.05rem; }
      .steps { grid-template-columns: 1fr; }
      .steps li + li { border-inline-start: 0; border-top: 1px solid var(--line); }
    }

    @media (max-width: 360px) {
      h1 { font-size: 3.15rem; }
      .brand { font-size: 1.35rem; }
      .masthead a { font-size: .875rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .action { transition: none; }
      .action:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header class="masthead container">
    <div class="brand">
      <span class="brand-mark"><img src="../assets/logo.png" width="640" height="640" alt=""></span>
      LastVN
    </div>
    <a href="#setup">Как подключиться</a>
  </header>
  <main class="container">
    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title">VPN <span>от Тохи</span></h1>
        <p class="tagline">бро, купи у тохи впн. не парься</p>
        <a class="action" href="https://t.me/iuanvl">Оформить в Telegram</a>
        <p class="contact">@iuanvl</p>
      </div>
      <figure class="location">
        <img src="netherlands.webp" width="1000" height="1250" alt="Канал и дома в Амстердаме в сумерках" fetchpriority="high">
        <figcaption><span class="flag" aria-hidden="true">🇳🇱</span> Первый, нидерландский</figcaption>
      </figure>
    </section>
    <section class="setup" id="setup">
      <h2>Как подключиться</h2>
      <ol class="steps" role="list">
        <li><strong>Напиши в Telegram</strong><p>Уточни условия подключения.</p></li>
        <li><strong>Получи ссылку</strong><p>Тоха пришлёт твою HTTPS-подписку.</p></li>
        <li><strong>Добавь подписку</strong><p>Открой ссылку в Happ или INCY.</p></li>
      </ol>
    </section>
  </main>
</body>
</html>
